name: Mobile CI

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/iqro_mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [master, main]
    paths:
      - "clients/iqro_mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/iqro_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - name: Disable CLI analytics
        run: flutter config --no-analytics
      - name: Verify Gradle wrapper integrity
        run: >-
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar"
          | sha256sum --check --strict
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Generate localization sources
        run: flutter gen-l10n
      - name: Verify generated localization sources
        run: git diff --exit-code -- lib/l10n/generated
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Android staging debug build
        run: >-
          flutter build apk
          --debug
          --target-platform android-arm64
          --dart-define=API_BASE_URL=https://staging.iqro.forum
          --dart-define=APP_ENV=staging
          --dart-define=APP_DOWNLOAD_URL=https://iqro.forum
      - name: Android production release compile
        run: >-
          flutter build appbundle
          --release
          --dart-define=API_BASE_URL=https://iqro.forum
          --dart-define=APP_ENV=production
          --dart-define=APP_DOWNLOAD_URL=https://iqro.forum
