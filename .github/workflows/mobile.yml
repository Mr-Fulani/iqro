name: Mobile CI

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/iqro_mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [master, main]
    paths:
      - "clients/iqro_mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/iqro_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - name: Disable CLI analytics
        run: flutter config --no-analytics
      - name: Verify Gradle wrapper integrity
        run: >-
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar"
          | sha256sum --check --strict
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Generate localization sources
        run: flutter gen-l10n
      - name: Verify generated localization sources
        run: git diff --exit-code -- lib/l10n/generated
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Android local debug build
        run: >-
          flutter build apk
          --debug
          --target-platform android-arm64
          --dart-define=APP_ENV=local
      - name: Android production release compile
        run: >-
          flutter build appbundle
          --release
          --dart-define=API_BASE_URL=https://iqro.forum
          --dart-define=APP_ENV=production
          --dart-define=APP_DOWNLOAD_URL=https://iqro.forum

  ios:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: clients/iqro_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Select App Store-compatible Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up locked CocoaPods toolchain
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0.1"
          working-directory: clients/iqro_mobile
          bundler-cache: true
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          bundle exec pod --version
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - name: Disable CLI analytics
        run: flutter config --no-analytics
      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate Apple configuration
        run: |
          ruby -c ios/Podfile
          plutil -lint ios/Runner/Info.plist ios/Runner/Info-Debug.plist ios/Flutter/AppFrameworkInfo.plist
          for file in ios/Runner/*.lproj/InfoPlist.strings; do
            plutil -lint "$file"
          done
      - name: Verify locked CocoaPods dependencies
        working-directory: clients/iqro_mobile/ios
        run: bundle exec pod install --deployment
      - name: iPhone and iPad production release compile
        run: >-
          bundle exec flutter build ios
          --release
          --no-codesign
          --dart-define=API_BASE_URL=https://iqro.forum
          --dart-define=APP_ENV=production
          --dart-define=APP_DOWNLOAD_URL=https://iqro.forum
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          device_id="$(
            xcrun simctl list devices available -j |
              ruby -rjson -e '
                devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                device = devices.find { |item| item["isAvailable"] && item["name"].start_with?("iPhone") }
                abort "No available iPhone simulator" unless device
                print device.fetch("udid")
              '
          )"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run native iOS configuration tests
        run: >-
          bundle exec xcodebuild test
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}"
          -only-testing:RunnerTests
          CODE_SIGNING_ALLOWED=NO
