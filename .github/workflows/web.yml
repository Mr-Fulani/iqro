name: Web CI

on:
  pull_request:
    paths:
      - "services/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [master, main]
    paths:
      - "services/web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type checking
        run: npm run typecheck
      - name: Shared cache handler tests
        run: npm run test:cache
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Development browser regression tests
        run: npm run test:e2e
      - name: Production browser regression tests
        run: npm run test:e2e:production
      - name: Lighthouse budgets
        run: npm run test:lighthouse
      - name: Dependency audit
        run: npm audit --audit-level=high
