name: Production Compose CI

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "compose.production.yaml"
      - "compose.observability.yaml"
      - "compose.staging.yaml"
      - "compose.staging.budget.yaml"
      - "services/backend/**"
      - "services/web/**"
      - "ops/gateway/**"
      - "ops/postgres/**"
      - "ops/observability/**"
      - "ops/monitoring/**"
      - "ops/scaling/**"
      - "ops/staging/**"
      - "ops/systemd/**"
      - "Makefile"
      - "docs/production.md"
      - "docs/staging.md"
      - ".github/workflows/production.yml"
  push:
    branches: [master, main]
    paths:
      - "compose.production.yaml"
      - "compose.observability.yaml"
      - "compose.staging.yaml"
      - "compose.staging.budget.yaml"
      - "services/backend/**"
      - "services/web/**"
      - "ops/gateway/**"
      - "ops/postgres/**"
      - "ops/observability/**"
      - "ops/monitoring/**"
      - "ops/scaling/**"
      - "ops/staging/**"
      - "ops/systemd/**"
      - "Makefile"
      - "docs/production.md"
      - "docs/staging.md"
      - ".github/workflows/production.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VERSION: ci-${{ github.sha }}
      PRODUCTION_ENV_FILE: ./services/backend/.env.production.example
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: >-
          docker compose
          --env-file services/backend/.env.production.example
          -f compose.production.yaml
          config --quiet
      - name: Validate staging bootstrap and Compose model
        run: |
          python -m ops.staging.test_config
          STAGING_R2_ACCESS_KEY_ID=ci-access-key \
          STAGING_R2_SECRET_ACCESS_KEY=ci-secret-key \
            python ops/staging/init.py \
              --host staging.example.test \
              --media-host media.staging.example.test \
              --acme-email ops@example.test \
              --r2-account-id 0123456789abcdef0123456789abcdef \
              --r2-bucket quran-staging \
              --output "$RUNNER_TEMP/quran-staging.env"
          python ops/staging/preflight.py \
            --env-file "$RUNNER_TEMP/quran-staging.env" \
            --require-media
          PRODUCTION_ENV_FILE="$RUNNER_TEMP/quran-staging.env" \
            docker compose \
              --env-file "$RUNNER_TEMP/quran-staging.env" \
              -f compose.production.yaml \
              -f compose.staging.yaml \
              config --quiet
          PRODUCTION_ENV_FILE="$RUNNER_TEMP/quran-staging.env" \
            docker compose \
              --env-file "$RUNNER_TEMP/quran-staging.env" \
              -f compose.production.yaml \
              -f compose.staging.yaml \
              -f compose.staging.budget.yaml \
              config --quiet
      - name: Validate observability model and rules
        run: |
          docker compose \
            --env-file services/backend/.env.production.example \
            -f compose.production.yaml \
            -f compose.observability.yaml \
            config --quiet
          mkdir -p "$RUNNER_TEMP/quran-observability"
          QURAN_OPERATIONS_TOKEN=0000000000000000000000000000000000000000 \
          OBSERVABILITY_MONTHLY_BUDGET_USD=100 \
          OBSERVABILITY_MONTHLY_ORIGIN_EGRESS_BUDGET_BYTES=107374182400 \
            python ops/observability/render_config.py \
              --output "$RUNNER_TEMP/quran-observability"
          docker run --rm --entrypoint /bin/promtool \
            -v "$RUNNER_TEMP/quran-observability:/runtime:ro" \
            prom/prometheus:v3.14.0 check config /runtime/prometheus.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$RUNNER_TEMP/quran-observability:/runtime:ro" \
            prom/alertmanager:v0.34.0 check-config /runtime/alertmanager.yml
      - name: Build production images
        run: >-
          docker compose
          --env-file services/backend/.env.production.example
          -f compose.production.yaml
          build backend web gateway postgres
      - name: Validate gateway runtime configuration
        run: >-
          docker run --rm
          --entrypoint nginx
          quran-platform-gateway:ci-${{ github.sha }}
          -t
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-backend:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-web:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-gateway:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-postgres:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan Redis image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redis:7.4.11-alpine3.21
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
