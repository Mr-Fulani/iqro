name: Production Compose CI

on:
  pull_request:
    paths:
      - "compose.production.yaml"
      - "services/backend/**"
      - "services/web/**"
      - "ops/gateway/**"
      - "ops/postgres/**"
      - "docs/production.md"
      - ".github/workflows/production.yml"
  push:
    branches: [master, main]
    paths:
      - "compose.production.yaml"
      - "services/backend/**"
      - "services/web/**"
      - "ops/gateway/**"
      - "ops/postgres/**"
      - "docs/production.md"
      - ".github/workflows/production.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VERSION: ci-${{ github.sha }}
      PRODUCTION_ENV_FILE: ./services/backend/.env.production.example
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: >-
          docker compose
          --env-file services/backend/.env.production.example
          -f compose.production.yaml
          config --quiet
      - name: Build production images
        run: >-
          docker compose
          --env-file services/backend/.env.production.example
          -f compose.production.yaml
          build backend web gateway postgres
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-backend:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-web:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-gateway:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quran-platform-postgres:ci-${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
      - name: Scan Redis image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redis:7.4.11-alpine3.21
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          skip-setup-trivy: true
