name: iOS release

# Signs the iPhone/iPad app for the App Store and uploads it to App Store
# Connect, where it appears in TestFlight. Started by hand from main only.
# Setup and secrets: docs/release/app-store.md, section 4.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (empty: the one in pubspec.yaml)"
        required: false
        type: string

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/iqro_mobile
    steps:
      - name: Check signing secrets
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        working-directory: .
        run: |
          missing=()
          for name in APPLE_TEAM_ID API_KEY_ID API_ISSUER_ID API_KEY_P8 CERT_P12 CERT_PASSWORD PROFILE_APP PROFILE_WIDGET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing signing settings: ${missing[*]} (see docs/release/app-store.md, section 4)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Select App Store-compatible Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up locked CocoaPods toolchain
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0.1"
          working-directory: clients/iqro_mobile
          bundler-cache: true
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - name: Disable CLI analytics
        run: flutter config --no-analytics
      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify locked CocoaPods dependencies
        working-directory: clients/iqro_mobile/ios
        run: bundle exec pod install --deployment
      - name: Install distribution certificate and profiles
        env:
          CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/iqro-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/distribution.p12"

          # Xcode 16+ reads UserData; older tools read MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$PROFILE_APP" | base64 --decode > "$dir/iqro-app-store.mobileprovision"
            printf '%s' "$PROFILE_WIDGET" | base64 --decode > "$dir/iqro-widget-app-store.mobileprovision"
          done

          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey.p8"
      - name: Configure the production Flutter build
        env:
          SENTRY_DSN: ${{ secrets.MOBILE_SENTRY_DSN }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=(
            --release --config-only --no-codesign
            --dart-define=API_BASE_URL=https://iqro.forum
            --dart-define=APP_ENV=production
            --dart-define=APP_DOWNLOAD_URL=https://iqro.forum
            --dart-define-from-file=config/firebase.json
          )
          if [ -n "$SENTRY_DSN" ]; then args+=("--dart-define=SENTRY_DSN=$SENTRY_DSN"); fi
          if [ -n "$BUILD_NUMBER" ]; then args+=("--build-number=$BUILD_NUMBER"); fi
          bundle exec flutter build ios "${args[@]}"
          grep -E '^FLUTTER_BUILD_(NAME|NUMBER)=' ios/Flutter/Generated.xcconfig
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: >-
          xcodebuild archive
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Runner.xcarchive"
          -exportOptionsPlist ios/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey.p8"
          -authenticationKeyID "$API_KEY_ID"
          -authenticationKeyIssuerID "$API_ISSUER_ID"
      - name: Keep debug symbols
        run: cd "$RUNNER_TEMP/Runner.xcarchive" && zip -qr "$RUNNER_TEMP/iqro-ios-dsyms.zip" dSYMs
      - uses: actions/upload-artifact@v4
        with:
          name: iqro-ios-dsyms
          path: ${{ runner.temp }}/iqro-ios-dsyms.zip
          retention-days: 30
      - name: Remove signing material
        if: always()
        working-directory: .
        run: |
          security delete-keychain "$RUNNER_TEMP/iqro-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/iqro-"*.mobileprovision
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/iqro-"*.mobileprovision
