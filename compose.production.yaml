name: ${COMPOSE_PROJECT_NAME:-quran-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-5}"

x-app-security: &app-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: quran_backend.settings.production
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
  DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
  DATABASE_HOST: ${DATABASE_HOST:-postgres}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-0}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  DATABASE_POOL_MODE: ${DATABASE_POOL_MODE:-direct}
  DATABASE_POSTGRES_MAX_CONNECTIONS: ${DATABASE_POSTGRES_MAX_CONNECTIONS:-100}
  DATABASE_POSTGRES_RESERVED_CONNECTIONS: ${DATABASE_POSTGRES_RESERVED_CONNECTIONS:-20}
  DATABASE_PGBOUNCER_SERVER_CONNECTIONS: ${DATABASE_PGBOUNCER_SERVER_CONNECTIONS:-40}
  DATABASE_PGBOUNCER_CLIENT_CONNECTIONS: ${DATABASE_PGBOUNCER_CLIENT_CONNECTIONS:-100}
  DATABASE_API_REPLICAS: ${DATABASE_API_REPLICAS:-1}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  API_MAX_CONCURRENT_REQUESTS_PER_WORKER: ${API_MAX_CONCURRENT_REQUESTS_PER_WORKER:-5}
  DATABASE_WORKER_REPLICAS: ${DATABASE_WORKER_REPLICAS:-1}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
  CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
  CELERY_BEAT_LOCK_KEY: ${CELERY_BEAT_LOCK_KEY:-quran-platform:celery-beat:lease}
  CELERY_BEAT_LOCK_TTL_SECONDS: ${CELERY_BEAT_LOCK_TTL_SECONDS:-60}
  CELERY_BEAT_LOCK_RENEW_INTERVAL_SECONDS: ${CELERY_BEAT_LOCK_RENEW_INTERVAL_SECONDS:-20}
  CELERY_BEAT_MAX_LOOP_INTERVAL_SECONDS: ${CELERY_BEAT_MAX_LOOP_INTERVAL_SECONDS:-5}
  DATABASE_BEAT_CONNECTIONS: ${DATABASE_BEAT_CONNECTIONS:-1}
  DATABASE_RELEASE_JOB_CONNECTIONS: ${DATABASE_RELEASE_JOB_CONNECTIONS:-2}
  DATABASE_OPERATIONS_CONNECTIONS: ${DATABASE_OPERATIONS_CONNECTIONS:-2}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:?Set REDIS_CACHE_URL in the production env file}
  REDIS_THROTTLE_URL: ${REDIS_THROTTLE_URL:?Set REDIS_THROTTLE_URL in the production env file}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set CELERY_BROKER_URL in the production env file}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?Set CELERY_RESULT_BACKEND in the production env file}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the production env file},gateway,backend
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:?Set PUBLIC_MEDIA_BASE_URL in the production env file}
  PUBLIC_AUDIO_BASE_URL: ${PUBLIC_AUDIO_BASE_URL:?Set PUBLIC_AUDIO_BASE_URL in the production env file}
  MEDIA_OBJECT_STORAGE_ENDPOINT_URL: ${MEDIA_OBJECT_STORAGE_ENDPOINT_URL:?Set MEDIA_OBJECT_STORAGE_ENDPOINT_URL in the production env file}
  MEDIA_OBJECT_STORAGE_BUCKET: ${MEDIA_OBJECT_STORAGE_BUCKET:?Set MEDIA_OBJECT_STORAGE_BUCKET in the production env file}
  MEDIA_OBJECT_STORAGE_ACCESS_KEY_ID: ${MEDIA_OBJECT_STORAGE_ACCESS_KEY_ID:?Set MEDIA_OBJECT_STORAGE_ACCESS_KEY_ID in the production env file}
  MEDIA_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MEDIA_OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set MEDIA_OBJECT_STORAGE_SECRET_ACCESS_KEY in the production env file}
  MEDIA_OBJECT_STORAGE_REGION: ${MEDIA_OBJECT_STORAGE_REGION:-auto}
  MEDIA_OBJECT_STORAGE_ADDRESSING_STYLE: ${MEDIA_OBJECT_STORAGE_ADDRESSING_STYLE:-path}
  MEDIA_CDN_REQUIRED_ORIGINS: ${MEDIA_CDN_REQUIRED_ORIGINS:?Set MEDIA_CDN_REQUIRED_ORIGINS in the production env file}
  WEB_CONTENT_REVALIDATION_URL: http://web:3000/api/internal/content-revalidation
  WEB_CONTENT_REVALIDATION_SECRET: ${WEB_CONTENT_REVALIDATION_SECRET:?Set WEB_CONTENT_REVALIDATION_SECRET in the production env file}
  PUBLIC_API_CACHE_PURGE_URL: ${PUBLIC_API_CACHE_PURGE_URL:-http://gateway:8080/internal/cache/purge-public-api}
  QF_AUDIO_SYNC_ENABLED: ${QF_AUDIO_SYNC_ENABLED:-false}

x-backend-service: &backend-service
  <<: *app-security
  image: ${BACKEND_IMAGE:-quran-platform-backend:${APP_VERSION:-local}}
  build:
    context: ./services/backend
    target: runtime
  env_file:
    - path: ${PRODUCTION_ENV_FILE:-./services/backend/.env.production}
      required: true
  environment: *backend-environment
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging: *default-logging

services:
  postgres:
    image: ${POSTGRES_IMAGE:-quran-platform-postgres:${APP_VERSION:-local}}
    build:
      context: ./ops/postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256
    shm_size: 256m
    logging: *default-logging

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    init: true
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    logging: *default-logging

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  static-init:
    <<: *backend-service
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        cp -R /app/staticfiles/. /static/
        && find /static -type d -exec chmod 0755 {} +
        && find /static -type f -exec chmod 0644 {} +
    volumes:
      - static-data:/static
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64

  backend:
    <<: *backend-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          healthcheck_host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip();
          request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host': healthcheck_host, 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 2.0
    mem_limit: 1024m
    pids_limit: 256

  worker:
    <<: *backend-service
    restart: unless-stopped
    command:
      - celery
      - -A
      - quran_backend.celery
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256

  beat:
    <<: *backend-service
    restart: unless-stopped
    command:
      - celery
      - -A
      - quran_backend.celery
      - beat
      - --loglevel=INFO
      - --scheduler=quran_backend.celery_beat.SingletonRedisScheduler
      - --max-interval=${CELERY_BEAT_MAX_LOOP_INTERVAL_SECONDS:-5}
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64

  web:
    <<: *app-security
    image: ${WEB_IMAGE:-quran-platform-web:${APP_VERSION:-local}}
    build:
      context: ./services/web
      target: runner
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SITE_URL: ${SITE_URL:?Set SITE_URL in the production env file}
      BACKEND_INTERNAL_URL: http://backend:8000
      ANDROID_APP_LINK_SHA256_CERT_FINGERPRINTS: ${ANDROID_APP_LINK_SHA256_CERT_FINGERPRINTS:-}
      APPLE_APP_LINK_APPLICATION_IDENTIFIERS: ${APPLE_APP_LINK_APPLICATION_IDENTIFIERS:-}
      WEB_CACHE_REQUIRED: "true"
      WEB_CACHE_REDIS_URL: ${WEB_CACHE_REDIS_URL:?Set WEB_CACHE_REDIS_URL in the production env file}
      WEB_CACHE_KEY_PREFIX: ${WEB_CACHE_KEY_PREFIX:-quran-platform:web-cache:v1}
      WEB_CACHE_ENTRY_TTL_SECONDS: ${WEB_CACHE_ENTRY_TTL_SECONDS:-86400}
      WEB_CACHE_TAG_TTL_SECONDS: ${WEB_CACHE_TAG_TTL_SECONDS:-172800}
      WEB_CACHE_MAX_ENTRY_BYTES: ${WEB_CACHE_MAX_ENTRY_BYTES:-8388608}
      WEB_CACHE_CONNECT_TIMEOUT_MS: ${WEB_CACHE_CONNECT_TIMEOUT_MS:-2000}
      WEB_CACHE_RETRY_DELAY_MS: ${WEB_CACHE_RETRY_DELAY_MS:-5000}
      WEB_CONTENT_REVALIDATION_SECRET: ${WEB_CONTENT_REVALIDATION_SECRET:?Set WEB_CONTENT_REVALIDATION_SECRET in the production env file}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:?Set LEGAL_ENTITY_NAME in the production env file}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:?Set LEGAL_CONTACT_EMAIL in the production env file}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:?Set SECURITY_CONTACT_EMAIL in the production env file}
      LEGAL_POSTAL_ADDRESS: ${LEGAL_POSTAL_ADDRESS:?Set LEGAL_POSTAL_ADDRESS in the production env file}
      LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:?Set LEGAL_JURISDICTION in the production env file}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:?Set LEGAL_EFFECTIVE_DATE in the production env file}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0755
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    logging: *default-logging

  gateway:
    image: ${GATEWAY_IMAGE:-quran-platform-gateway:${APP_VERSION:-local}}
    build:
      context: ./ops/gateway
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-3000}:8080"
    volumes:
      - static-data:/srv/static:ro
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/lib/nginx/tmp:size=64m,mode=0750,uid=100,gid=101
      - /var/log/nginx:size=8m
      - /run/nginx:size=4m
      - /tmp:size=16m
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      static-init:
        condition: service_completed_successfully
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  db-backup:
    image: ${POSTGRES_IMAGE:-quran-platform-postgres:${APP_VERSION:-local}}
    profiles: ["ops"]
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      PGUSER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1024}
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    logging: *default-logging

  db-backup-offsite:
    <<: *app-security
    image: ${BACKEND_IMAGE:-quran-platform-backend:${APP_VERSION:-local}}
    # Local dumps are deliberately mode 0600. This short-lived, read-only
    # operations container must use the same root identity that creates them.
    user: "0:0"
    profiles: ["ops"]
    restart: "no"
    entrypoint: ["python", "/ops/offsite.py", "upload"]
    environment:
      BACKUP_DIR: /backups
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:-production}
      BACKUP_OBJECT_STORAGE_ENDPOINT_URL: ${BACKUP_OBJECT_STORAGE_ENDPOINT_URL:-}
      BACKUP_OBJECT_STORAGE_BUCKET: ${BACKUP_OBJECT_STORAGE_BUCKET:-}
      BACKUP_OBJECT_STORAGE_ACCESS_KEY_ID: ${BACKUP_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      BACKUP_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${BACKUP_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      BACKUP_OBJECT_STORAGE_REGION: ${BACKUP_OBJECT_STORAGE_REGION:-auto}
      BACKUP_OBJECT_STORAGE_ADDRESSING_STYLE: ${BACKUP_OBJECT_STORAGE_ADDRESSING_STYLE:-path}
      BACKUP_OBJECT_STORAGE_PREFIX: ${BACKUP_OBJECT_STORAGE_PREFIX:-quran-platform/postgres}
      BACKUP_OBJECT_STORAGE_RETENTION_DAYS: ${BACKUP_OBJECT_STORAGE_RETENTION_DAYS:-30}
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    logging: *default-logging

  db-backup-offsite-verify:
    extends:
      service: db-backup-offsite
    entrypoint: ["python", "/ops/offsite.py", "verify"]

  db-backup-offsite-download:
    extends:
      service: db-backup-offsite
    user: "0:0"
    read_only: true
    entrypoint:
      - python
      - /ops/offsite.py
      - download
      - --output
      - /backups/offsite_restore.dump
      - --replace
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups

  db-backup-verify:
    image: ${POSTGRES_IMAGE:-quran-platform-postgres:${APP_VERSION:-local}}
    profiles: ["ops"]
    restart: "no"
    init: true
    environment:
      BACKUP_FILE: ${BACKUP_FILE:-}
    entrypoint: ["/bin/sh", "/ops/verify.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    logging: *default-logging

  db-restore-check:
    image: ${POSTGRES_IMAGE:-quran-platform-postgres:${APP_VERSION:-local}}
    profiles: ["ops"]
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      PGUSER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_CHECK_DATABASE: ${RESTORE_CHECK_DATABASE:-quran_restore_check}
    entrypoint: ["/bin/sh", "/ops/restore-check.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 128
    logging: *default-logging

  db-restore:
    image: ${POSTGRES_IMAGE:-quran-platform-postgres:${APP_VERSION:-local}}
    profiles: ["dangerous-restore"]
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      PGUSER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_DATABASE_NAME: ${RESTORE_DATABASE_NAME:-}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
    entrypoint: ["/bin/sh", "/ops/restore.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 128
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  static-data:
