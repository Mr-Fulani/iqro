name: ${COMPOSE_PROJECT_NAME:-quran-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-5}"

x-app-security: &app-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: quran_backend.settings.production
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
  DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the production env file}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:?Set PUBLIC_MEDIA_BASE_URL in the production env file}
  PUBLIC_AUDIO_BASE_URL: ${PUBLIC_AUDIO_BASE_URL:?Set PUBLIC_AUDIO_BASE_URL in the production env file}
  QF_AUDIO_SYNC_ENABLED: ${QF_AUDIO_SYNC_ENABLED:-false}

x-backend-service: &backend-service
  <<: *app-security
  image: ${BACKEND_IMAGE:-quran-platform-backend:${APP_VERSION:-local}}
  build:
    context: ./services/backend
    target: runtime
  env_file:
    - path: ${PRODUCTION_ENV_FILE:-./services/backend/.env.production}
      required: true
  environment: *backend-environment
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging: *default-logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256
    shm_size: 256m
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    logging: *default-logging

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  static-init:
    <<: *backend-service
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        cp -R /app/staticfiles/. /static/
        && find /static -type d -exec chmod 0755 {} +
        && find /static -type f -exec chmod 0644 {} +
    volumes:
      - static-data:/static
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64

  backend:
    <<: *backend-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 2.0
    mem_limit: 1024m
    pids_limit: 256

  worker:
    <<: *backend-service
    restart: unless-stopped
    command: ["celery", "-A", "quran_backend.celery", "worker", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256

  beat:
    <<: *backend-service
    restart: unless-stopped
    command:
      - celery
      - -A
      - quran_backend.celery
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64

  web:
    <<: *app-security
    image: ${WEB_IMAGE:-quran-platform-web:${APP_VERSION:-local}}
    build:
      context: ./services/web
      target: runner
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SITE_URL: ${SITE_URL:?Set SITE_URL in the production env file}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0755
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    logging: *default-logging

  gateway:
    image: ${GATEWAY_IMAGE:-quran-platform-gateway:${APP_VERSION:-local}}
    build:
      context: ./ops/gateway
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-3000}:8080"
    volumes:
      - ${QURAN_MEDIA_DIR:-./services/backend/media}:/srv/media:ro
      - static-data:/srv/static:ro
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=16m
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      static-init:
        condition: service_completed_successfully
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  db-backup:
    image: postgres:17-alpine
    profiles: ["ops"]
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      PGUSER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1024}
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    logging: *default-logging

  db-backup-verify:
    image: postgres:17-alpine
    profiles: ["ops"]
    restart: "no"
    init: true
    environment:
      BACKUP_FILE: ${BACKUP_FILE:-}
    entrypoint: ["/bin/sh", "/ops/verify.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    logging: *default-logging

  db-restore-check:
    image: postgres:17-alpine
    profiles: ["ops"]
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      PGUSER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_CHECK_DATABASE: ${RESTORE_CHECK_DATABASE:-quran_restore_check}
    entrypoint: ["/bin/sh", "/ops/restore-check.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 128
    logging: *default-logging

  db-restore:
    image: postgres:17-alpine
    profiles: ["dangerous-restore"]
    restart: "no"
    init: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DATABASE_NAME:?Set DATABASE_NAME in the production env file}
      PGUSER: ${DATABASE_USER:?Set DATABASE_USER in the production env file}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the production env file}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_DATABASE_NAME: ${RESTORE_DATABASE_NAME:-}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-}
    entrypoint: ["/bin/sh", "/ops/restore.sh"]
    volumes:
      - ./ops/postgres:/ops:ro
      - ${QURAN_BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 128
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  static-data:
