services:
  web:
    build:
      context: ../web
      dockerfile: ../web/Dockerfile
      target: development
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    volumes:
      - ../web:/app
      - /app/node_modules
