<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="{{ align }}" style="margin:8px 0 20px 0; border-collapse:separate;">
  <tr>
    <td bgcolor="#047857" style="background-color:#047857; border-radius:10px;">
      <a href="{{ button_url }}" style="display:inline-block; padding:14px 28px; font-family:{{ font_stack }}; font-size:16px; line-height:20px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px;">{{ button_label }}</a>
    </td>
  </tr>
</table>
<p class="iq-muted" style="clear:both; margin:0; font-size:13px; line-height:20px; color:#64748b;">{{ button_fallback }}<br><a class="iq-link" href="{{ button_url }}" dir="ltr" style="color:#047857; word-break:break-all;">{{ button_url }}</a></p>
