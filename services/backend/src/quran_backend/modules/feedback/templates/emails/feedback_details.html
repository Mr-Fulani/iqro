<table role="presentation" class="iq-panel" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8fafc" style="background-color:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; border-collapse:separate; margin:0 0 24px 0;">
{% for label, value in details %}
  <tr>
    <td class="iq-muted" valign="top" style="padding:{% if forloop.first %}14px{% else %}6px{% endif %} 16px {% if forloop.last %}14px{% else %}6px{% endif %} 16px; width:38%; text-align:{{ align }}; font-size:14px; line-height:22px; color:#475569;">{{ label }}</td>
    <td class="iq-text" valign="top" dir="auto" style="padding:{% if forloop.first %}14px{% else %}6px{% endif %} 16px {% if forloop.last %}14px{% else %}6px{% endif %} 16px; text-align:{{ align }}; font-size:14px; line-height:22px; font-weight:600; color:#0f172a; word-break:break-word;">{{ value }}</td>
  </tr>
{% endfor %}
</table>
