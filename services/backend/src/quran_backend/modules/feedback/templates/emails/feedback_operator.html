{% extends "emails/base.html" %}
{% block content %}
<h1 class="iq-title" style="margin:0 0 20px 0; font-size:24px; line-height:32px; font-weight:700; color:#0f172a;">{{ title }}</h1>
{% include "emails/feedback_details.html" %}
<p class="iq-muted" style="margin:0 0 8px 0; font-size:13px; line-height:20px; font-weight:600; color:#475569; text-transform:uppercase; letter-spacing:0.5px;">{{ message_label }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td class="iq-text" dir="auto" style="border-{{ align }}:3px solid #047857; padding:4px 16px; text-align:{{ align }}; font-size:15px; line-height:24px; color:#334155; word-break:break-word;">{{ message_body|linebreaksbr }}</td>
  </tr>
</table>
{% include "emails/button.html" %}
{% endblock %}
