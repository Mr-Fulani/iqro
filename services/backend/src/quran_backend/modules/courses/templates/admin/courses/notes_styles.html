<style>
  .cv-heading { font-size: 18px; margin: 20px 0 8px; }
  .cv-quote { margin: 0 0 12px; padding: 10px 16px; border: 0; border-inline-start: 4px solid #8a6d3b; background: var(--darkened-bg, #f8f8f8); }
  .cv-quote footer { color: var(--body-quiet-color, #666); margin-top: 6px; font-size: 14px; }
  .cv-note { margin: 0 0 12px; padding: 10px 16px; border: 1px solid #e0a800; border-radius: 6px; background: #fff8e1; color: #4d3800; }
  .cv-ar { font-family: "Amiri Quran", "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif; font-size: 1.3em; line-height: 1.9; }
  /* «!» and «?» after a word, as students see them; the text opens in a popover. */
  .cv-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; margin: 0 2px; padding: 0; border: 1.5px solid #2e7d32; border-radius: 50%; background: #e3f3e5; color: #1b5e20; font: 700 13px/1 var(--font-family-primary, sans-serif); vertical-align: 0.1em; cursor: pointer; }
  .cv-mark.is-warning { border-color: #d97706; background: #fef3c7; color: #92400e; }
  .cv-mark-pop { max-width: min(28rem, calc(100vw - 32px)); padding: 12px 14px; border: 1px solid #2e7d32; border-inline-start-width: 4px; border-radius: 6px; background: var(--body-bg, #fff); color: var(--body-fg, #333); line-height: 1.6; box-shadow: 0 8px 24px rgb(0 0 0 / 20%); }
  .cv-mark-pop.is-warning { border-color: #d97706; }
  .cv-link { text-decoration: underline; }
  .cv-links { margin: 4px 0 12px; }
  .cv-links td { vertical-align: top; }
  .cv-links code { unicode-bidi: plaintext; word-break: break-all; }
  @media (prefers-color-scheme: dark) { .cv-note { background: #3a2f00; color: #ffe8a3; } }
</style>
