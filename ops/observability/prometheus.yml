global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /runtime/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: quran-backend
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /runtime/operations-token
    http_headers:
      X-Forwarded-Proto:
        values: [https]
    static_configs:
      - targets: [backend:8000]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: celery
    static_configs:
      - targets: [celery-exporter:9540]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
