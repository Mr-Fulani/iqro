map $http_x_forwarded_proto $quran_forwarded_proto {
    default $scheme;
    ~*^https$ https;
}

map $request_method $quran_public_api_method_bypass {
    default 1;
    GET 0;
    HEAD 0;
}

map $http_authorization $quran_public_api_authorization_bypass {
    default 1;
    "" 0;
}

map $http_cookie $quran_public_api_cookie_bypass {
    default 1;
    "" 0;
}

map "$quran_public_api_method_bypass:$quran_public_api_authorization_bypass:$quran_public_api_cookie_bypass" $quran_public_api_bypass {
    default 1;
    "0:0:0" 0;
}

map $upstream_http_cache_control $quran_public_api_response_no_cache {
    default 1;
    ~*\bpublic\b 0;
}

map $request_method $quran_public_api_purge_method {
    default 0;
    PURGE 1;
}

# The gateway only listens behind the host TLS proxy, which appends the
# client address as the last X-Forwarded-For entry. Rate limits key on that
# entry; direct local requests without the header fall back to the peer.
map $http_x_forwarded_for $quran_client_address {
    default $remote_addr;
    "~(?:^|,)\s*(?<quran_forwarded_client>[^,\s]+)\s*$" $quran_forwarded_client;
}

# Page loads fan out into many API and asset requests, so bursts are generous;
# the limits only stop a single client from occupying every backend slot.
limit_req_zone $quran_client_address zone=quran_api_rate:10m rate=20r/s;
limit_req_zone $quran_client_address zone=quran_web_rate:10m rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

proxy_cache_path /var/cache/nginx/public-api levels=1:2 keys_zone=quran_public_api:4m max_size=24m inactive=1h use_temp_path=off;

# Uvicorn counts idle keep-alive connections against API_MAX_CONCURRENT_REQUESTS_PER_WORKER,
# so the idle pool (keepalive x worker_processes) stays well below the API's slots. Idle
# connections close before uvicorn's and Node's 5 s keep-alive timeout, so nginx never
# reuses a connection the upstream is already closing (a sporadic 502).
# One id per request across gateway, Django and Next logs: keep a well-formed
# incoming X-Request-ID (same pattern the API middleware accepts), else nginx's own.
map $http_x_request_id $quran_request_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $http_x_request_id;
}

# Access log as JSON on stdout, collected by Docker like the other services.
# File logs on the 8 MB tmpfs stopped silently once it filled up.
log_format quran_json escape=json
    '{"time":"$time_iso8601","request_id":"$quran_request_id",'
    '"remote_addr":"$remote_addr","forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"cache":"$upstream_cache_status","user_agent":"$http_user_agent"}';

upstream quran_backend {
    zone quran_backend 64k;
    server backend:8000 resolve;
    keepalive 8;
    keepalive_timeout 4s;
}

upstream quran_web {
    zone quran_web 64k;
    server web:3000 resolve;
    keepalive 8;
    keepalive_timeout 4s;
}

server {
    listen 8080;
    access_log /dev/stdout quran_json;
    server_name _;
    server_tokens off;

    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/javascript application/manifest+json application/xml text/css text/plain text/xml image/svg+xml;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    include /etc/nginx/snippets/quran-security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        root /srv;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/quran-security-headers.conf;
        access_log off;
    }

    location ~ ^/api/v1/(?:quran(?:/|$)|reciters(?:/|$)|recitations(?:/|$)|prayer/methods(?:/|$)|library(?:/|$)) {
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        limit_req zone=quran_api_rate burst=60 nodelay;

        proxy_cache quran_public_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_convert_head off;
        proxy_cache_key "quran-public-api|$request_method|$request_uri|origin=$http_origin|accept=$http_accept";
        proxy_cache_bypass $quran_public_api_bypass;
        proxy_no_cache $quran_public_api_bypass $quran_public_api_response_no_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_lock_age 5s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

        add_header X-Quran-Edge-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/quran-security-headers.conf;
    }

    location = /internal/cache/purge-public-api {
        if ($quran_public_api_purge_method = 0) {
            return 405;
        }
        auth_request /internal/cache/purge-auth;
        proxy_cache quran_public_api;
        proxy_cache_key "quran-public-api|purge-control";
        proxy_cache_purge PURGE purge_all from all;
        proxy_pass http://quran_backend;
    }

    location = /internal/cache/purge-auth {
        internal;
        proxy_pass http://quran_backend/api/v1/internal/gateway-cache-purge-auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Browser authentication is implemented by the Next.js BFF. Keep its
    # HttpOnly cookies and installation credentials away from the public
    # backend route by forwarding this namespace to the web container.
    location /api/web-auth/ {
        limit_req zone=quran_api_rate burst=60 nodelay;
        proxy_pass http://quran_web;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=quran_api_rate burst=60 nodelay;
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Whole-surah MP3 uploads in the admin: one file per request, up to 512 MB.
    # The body streams straight to the backend, which spools it to its upload volume.
    location ~ ^/admin/audio/recitationedition/[^/]+/surahs/upload/$ {
        client_max_body_size 520m;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Lesson videos (up to 480 MB) and their dubs (up to 200 MB) in the courses admin.
    # Like surahs, the body streams to the backend's upload volume; remuxing and joining
    # a dub take up to a few minutes after the last byte.
    location ~ ^/admin/courses/courselesson/[^/]+/video/(dubs/[a-z]+/)?upload/$ {
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /admin/ {
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=quran_web_rate burst=120 nodelay;
        proxy_pass http://quran_web;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $quran_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
