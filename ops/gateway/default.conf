map $http_x_forwarded_proto $quran_forwarded_proto {
    default $scheme;
    ~*^https$ https;
}

map $request_method $quran_public_api_method_bypass {
    default 1;
    GET 0;
    HEAD 0;
}

map $http_authorization $quran_public_api_authorization_bypass {
    default 1;
    "" 0;
}

map $http_cookie $quran_public_api_cookie_bypass {
    default 1;
    "" 0;
}

map "$quran_public_api_method_bypass:$quran_public_api_authorization_bypass:$quran_public_api_cookie_bypass" $quran_public_api_bypass {
    default 1;
    "0:0:0" 0;
}

map $upstream_http_cache_control $quran_public_api_response_no_cache {
    default 1;
    ~*\bpublic\b 0;
}

map $request_method $quran_public_api_purge_method {
    default 0;
    PURGE 1;
}

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

proxy_cache_path /var/cache/nginx/public-api levels=1:2 keys_zone=quran_public_api:4m max_size=24m inactive=1h use_temp_path=off;

upstream quran_backend {
    zone quran_backend 64k;
    server backend:8000 resolve;
    keepalive 32;
}

upstream quran_web {
    zone quran_web 64k;
    server web:3000 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    include /etc/nginx/snippets/quran-security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        root /srv;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/quran-security-headers.conf;
        access_log off;
    }

    location ~ ^/api/v1/(?:quran(?:/|$)|reciters(?:/|$)|recitations(?:/|$)|prayer/methods(?:/|$)|library(?:/|$)) {
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache quran_public_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_convert_head off;
        proxy_cache_key "quran-public-api|$request_method|$request_uri|origin=$http_origin|accept=$http_accept";
        proxy_cache_bypass $quran_public_api_bypass;
        proxy_no_cache $quran_public_api_bypass $quran_public_api_response_no_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_lock_age 5s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

        add_header X-Quran-Edge-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/quran-security-headers.conf;
    }

    location = /internal/cache/purge-public-api {
        if ($quran_public_api_purge_method = 0) {
            return 405;
        }
        auth_request /internal/cache/purge-auth;
        proxy_cache quran_public_api;
        proxy_cache_key "quran-public-api|purge-control";
        proxy_cache_purge PURGE purge_all from all;
        proxy_pass http://quran_backend;
    }

    location = /internal/cache/purge-auth {
        internal;
        proxy_pass http://quran_backend/api/v1/internal/gateway-cache-purge-auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /admin/ {
        proxy_pass http://quran_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://quran_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $quran_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
